<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo Scout · Tablero</title>
  <meta name="theme-color" content="#2f4f2f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%232f4f2f' stroke='%23e0a526' stroke-width='6' stroke-dasharray='8 6'/><text x='50' y='66' font-size='44' text-anchor='middle' fill='%23f4ebd0' font-family='Georgia' font-weight='bold'>B</text></svg>">
  <link rel="stylesheet" href="/css/scout.css">
  <link rel="stylesheet" href="/css/tablero.css">
</head>
<body class="tablero">
  <header class="cartel">
    <span id="flor"></span>
    <div class="titulos">
      <h1 id="nombre-grupo">Nuestra Señora del Rosario de Pompeya</h1>
      <div class="sub">¡Bingo de patrulla!</div>
    </div>
    <span class="espacio"></span>
    <span class="contador" id="contador">0 / 90</span>
    <span class="estado-conexion" id="conexion">Conectando…</span>
    <button class="boton-icono" id="btn-voz" aria-pressed="false" title="Cantar los números en voz alta">🔇 Voz</button>
    <button class="boton-icono" id="btn-repetir" title="Volver a cantar el último número">🔁 Repetir</button>
    <button class="boton-icono" id="btn-ajustes-voz" aria-expanded="false" aria-controls="panel-voz" title="Elegir la voz">⚙</button>
    <div class="panel-voz" id="panel-voz" hidden>
      <label for="sel-voz">Voz</label>
      <select id="sel-voz"></select>
      <p class="nota-voz" id="nota-voz"></p>
      <label class="check"><input type="checkbox" id="chk-cifras"> <span>Decir también las cifras <span class="ej">(“47… cuatro, siete”)</span></span></label>
      <button type="button" class="boton-icono" id="btn-probar-voz">▶ Probar</button>
    </div>
    <button class="boton-icono" id="btn-pantalla" title="Pantalla completa">⛶</button>
  </header>

  <main class="escenario">
    <aside class="panel">
      <div class="etiqueta">Último número</div>
      <div class="parche" id="parche">
        <div class="parche-interior">
          <span id="ultimo" class="ultimo-numero vacio">¡Siempre listos!</span>
        </div>
      </div>
      <svg class="fogon" viewBox="0 0 120 70" aria-hidden="true">
        <g class="llamas">
          <path class="llama l1" d="M60 8c10 14 20 22 20 36a20 20 0 0 1-40 0c0-10 8-16 10-26 4 6 6 10 10 12-2-8-2-14 0-22z"/>
          <path class="llama l2" d="M60 26c6 8 12 12 12 20a12 12 0 0 1-24 0c0-6 4-10 6-14 2 4 4 6 6 6-1-4-1-8 0-12z"/>
        </g>
        <rect x="22" y="52" width="76" height="9" rx="4.5" transform="rotate(-12 60 56)" fill="#6b4423"/>
        <rect x="22" y="52" width="76" height="9" rx="4.5" transform="rotate(12 60 56)" fill="#4a2e17"/>
      </svg>
      <div class="etiqueta chica" id="etiqueta-hist" hidden>Anteriores</div>
      <div class="historial" id="historial"></div>
    </aside>

    <section class="zona-grilla">
      <div class="grilla" id="grilla"></div>
    </section>
  </main>

  <footer class="pie">
    <span>Desarrollado por</span>
    <a href="https://sinaptic.ar" target="_blank" rel="noopener"><img src="/img/sinaptic.png" alt="Sinaptic" width="464" height="94"></a>
  </footer>

  <div class="aviso" id="aviso"></div>
  <script type="module" src="/js/tablero.js"></script>
</body>
</html>
